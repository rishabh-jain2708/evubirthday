<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sorting Vote</title>
<meta name="description" content="A live A/B sorting vote for a magical first birthday.">
<style>
  :root{
    --navy-0:#0b0e23;
    --navy-1:#12163a;
    --gold:#c9a227;
    --gold-lt:#e8c65a;
    --cream:#f1e6c8;
    --gryff-0:#8a1215;
    --gryff-1:#b8383b;
    --slyth-0:#1a472a;
    --slyth-1:#2f6b45;
    --glass:rgba(241,230,200,.08);
    --line:rgba(201,162,39,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:Georgia,"Palatino Linotype",Palatino,"Book Antiqua",
                "Noto Serif Devanagari","Kohinoor Devanagari","Devanagari MT",serif;
    color:var(--cream);
    background:
      radial-gradient(1200px 700px at 50% -10%, #1a1f4d 0%, transparent 60%),
      linear-gradient(160deg, var(--navy-0) 0%, var(--navy-1) 100%);
    background-attachment:fixed;
    min-height:100%;
    -webkit-text-size-adjust:100%;
  }
  /* faint starfield */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1.2px 1.2px at 78% 12%, rgba(232,198,90,.55), transparent 60%),
      radial-gradient(1px 1px at 33% 62%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(1.6px 1.6px at 62% 78%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1px 1px at 88% 54%, rgba(232,198,90,.4), transparent 60%),
      radial-gradient(1.2px 1.2px at 8% 82%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1px 1px at 46% 30%, rgba(255,255,255,.28), transparent 60%),
      radial-gradient(1.3px 1.3px at 92% 88%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(1px 1px at 22% 44%, rgba(232,198,90,.3), transparent 60%);
    opacity:.75;
  }
  .wrap{
    position:relative; z-index:1;
    max-width:1100px; margin:0 auto;
    padding:clamp(18px,4vw,44px) clamp(16px,4vw,32px) 64px;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  .eyebrow{
    font-variant:small-caps; letter-spacing:.22em; text-transform:lowercase;
    color:var(--gold-lt); font-size:clamp(.72rem,1.6vw,.95rem);
    text-align:center; margin:0 0 .6em;
    text-shadow:0 0 18px rgba(201,162,39,.35);
  }
  h1{
    font-size:clamp(2.1rem,7vw,4.6rem);
    margin:0 0 .18em; text-align:center; font-weight:400;
    color:var(--gold-lt); letter-spacing:.02em;
    text-shadow:0 0 30px rgba(201,162,39,.30), 0 2px 0 rgba(0,0,0,.4);
  }
  .tagline{
    text-align:center; margin:0 auto 2.2em; max-width:34em;
    color:rgba(241,230,200,.82); font-style:italic;
    font-size:clamp(1rem,2.2vw,1.25rem); line-height:1.6;
  }
  .center{flex:1; display:flex; flex-direction:column; justify-content:center}
  .roles{display:flex; gap:clamp(12px,2.5vw,22px); flex-wrap:wrap; justify-content:center}
  button{font:inherit; color:inherit; cursor:pointer}
  .btn{
    background:linear-gradient(180deg, rgba(201,162,39,.18), rgba(201,162,39,.06));
    border:1px solid var(--line); border-radius:14px;
    color:var(--gold-lt); padding:1em 1.6em; font-size:clamp(1rem,2vw,1.2rem);
    letter-spacing:.04em; transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
    box-shadow:0 0 0 rgba(201,162,39,0);
  }
  .btn:hover{background:linear-gradient(180deg, rgba(201,162,39,.3), rgba(201,162,39,.1));
    box-shadow:0 0 28px rgba(201,162,39,.22); transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{
    background:linear-gradient(180deg, var(--gold), #a8861d);
    color:#1a1405; border-color:var(--gold-lt); font-weight:700;
  }
  .btn.primary:hover{background:linear-gradient(180deg, var(--gold-lt), var(--gold))}
  .btn.ghost{color:rgba(241,230,200,.7); border-color:rgba(241,230,200,.2); background:transparent}
  .btn.ghost.arm{color:#ffb4b4; border-color:rgba(184,56,59,.8);
    background:rgba(138,18,21,.28); box-shadow:0 0 24px rgba(138,18,21,.4)}
  .btn.big{min-width:min(300px,80vw); padding:1.3em 1.8em}

  .status{
    display:inline-flex; align-items:center; gap:.5em;
    font-size:.82rem; letter-spacing:.12em; font-variant:small-caps;
    color:rgba(241,230,200,.6); border:1px solid rgba(241,230,200,.14);
    border-radius:999px; padding:.32em .9em; background:rgba(0,0,0,.2);
  }
  .status .dot{font-size:1.1em; line-height:1; color:#7a6f52}
  .status.live .dot{color:#4ecb71; text-shadow:0 0 10px rgba(78,203,113,.8)}
  .status.live{color:rgba(241,230,200,.8)}
  .status-row{display:flex; justify-content:center; margin-top:2.4em}

  .qmeta{
    text-align:center; font-variant:small-caps; letter-spacing:.2em;
    color:var(--gold); font-size:clamp(.8rem,1.6vw,1rem); margin:0 0 .8em;
  }
  .question{
    text-align:center; font-size:clamp(1.5rem,4.6vw,3rem); line-height:1.25;
    margin:0 auto 1.1em; max-width:22em; font-weight:400; color:var(--cream);
    text-shadow:0 2px 24px rgba(0,0,0,.5);
  }
  .live-note{
    text-align:center; color:var(--gold-lt); font-style:italic;
    letter-spacing:.06em; margin:0 0 1.6em; min-height:1.5em;
  }
  .live-note .pulse{animation:pulse 1.8s ease-in-out infinite; display:inline-block}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---- Option cards (guest voting buttons) ---- */
  .options{display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px,2.5vw,24px)}
  .opt{
    border-radius:18px; padding:0; text-align:center; overflow:hidden;
    border:2px solid rgba(255,255,255,.16); position:relative;
    display:flex; flex-direction:column; width:100%;
    transition:transform .15s ease, box-shadow .2s ease, opacity .2s ease;
    color:var(--cream); background:rgba(0,0,0,.28);
  }
  /* The photograph itself carries nothing — no text, no scrim, no overlay. */
  .optframe{display:block; position:relative; width:100%; aspect-ratio:16/11;
    max-height:26vh; overflow:hidden}
  .optpic{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center 34%;
  }
  .opt.nopic .optframe{display:none}
  /* Only shown if a photo is missing, so the card is never a blank slab. */
  .optfallback{display:none; padding:1.4em .8em; font-size:clamp(1.1rem,3vw,1.6rem);
    font-variant:small-caps; letter-spacing:.16em; color:var(--cream)}
  .opt.nopic .optfallback{display:block}
  .opt .letter{
    font-size:clamp(.95rem,2vw,1.25rem); font-variant:small-caps; letter-spacing:.2em;
    color:var(--gold-lt);
  }
  .opt .label{font-size:clamp(1rem,2.4vw,1.45rem); line-height:1.25}
  .opt.a{border-color:rgba(184,56,59,.85); box-shadow:0 10px 30px rgba(138,18,21,.35)}
  .opt.b{border-color:rgba(47,107,69,.9);   box-shadow:0 10px 30px rgba(26,71,42,.38)}

  /* no photo yet: fall back to the flat house colours */
  .opt.nopic.a{background:linear-gradient(165deg, var(--gryff-1), var(--gryff-0))}
  .opt.nopic.b{background:linear-gradient(165deg, var(--slyth-1), var(--slyth-0))}

  button.opt:hover{transform:translateY(-2px)}
  button.opt:disabled{cursor:default; opacity:.55; transform:none}
  .opt.chosen{outline:3px solid var(--gold-lt); outline-offset:2px; opacity:1 !important;
    border-color:var(--gold-lt); box-shadow:0 0 40px rgba(232,198,90,.45)}
  .opt.chosen::after{
    content:"your vote"; position:absolute; top:8px; right:10px; z-index:2;
    font-size:.68rem; letter-spacing:.18em; font-variant:small-caps; color:var(--gold-lt);
    background:rgba(11,14,35,.75); border-radius:999px; padding:.15em .7em;
  }

  /* ---- House point vials (results) ---- */
  .vials{display:grid; grid-template-columns:1fr 1fr; gap:clamp(20px,5vw,64px);
    justify-items:center; margin:.4em auto 1.4em; max-width:760px}
  .vial-col{display:flex; flex-direction:column; align-items:center; gap:.8em; width:100%}
  .vial{
    position:relative; width:clamp(84px,16vw,132px); height:clamp(200px,34vh,320px);
    border-radius:14px 14px 26px 26px;
    background:linear-gradient(100deg, rgba(255,255,255,.10), rgba(255,255,255,.03) 40%, rgba(255,255,255,.08));
    border:1px solid rgba(241,230,200,.30);
    box-shadow:inset 0 0 34px rgba(255,255,255,.07), 0 12px 40px rgba(0,0,0,.45);
    overflow:hidden; backdrop-filter:blur(2px);
  }
  .vial .neck{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:52%; height:12px; border-radius:6px;
    background:linear-gradient(180deg, rgba(241,230,200,.35), rgba(241,230,200,.12));
    border:1px solid rgba(241,230,200,.3);
  }
  .fill{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    transition:height 1.1s cubic-bezier(.22,1,.36,1);
  }
  .fill::before{ /* liquid surface shimmer */
    content:""; position:absolute; top:-4px; left:0; right:0; height:8px;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    border-radius:50%;
  }
  .fill.a{background:linear-gradient(180deg, var(--gryff-1), var(--gryff-0));
    box-shadow:0 0 40px rgba(184,56,59,.65), inset 0 0 24px rgba(255,255,255,.18)}
  .fill.b{background:linear-gradient(180deg, var(--slyth-1), var(--slyth-0));
    box-shadow:0 0 40px rgba(47,107,69,.6), inset 0 0 24px rgba(255,255,255,.18)}
  .vial .shine{
    position:absolute; top:8px; left:12%; width:14%; height:76%; border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.05));
    filter:blur(1px); pointer-events:none;
  }
  .vial .shine.small{left:auto; right:12%; width:6%; height:44%; opacity:.5}
  .vial-pct{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; font-size:clamp(1.4rem,3.4vw,2.2rem); color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.7); letter-spacing:.02em;
  }
  .vial-label{text-align:center; line-height:1.35; max-width:16em}
  .vial-label .letter{
    display:block; font-variant:small-caps; letter-spacing:.26em; font-size:.85rem;
    color:var(--gold);
  }
  .vial-label .txt{font-size:clamp(.95rem,2.1vw,1.25rem)}
  .vial-label .count{display:block; color:rgba(241,230,200,.65); font-size:.9rem; margin-top:.25em}
  .total{text-align:center; color:rgba(241,230,200,.7); font-style:italic; margin:.2em 0 1.6em}

  .controls{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:.6em}
  .guest-msg{
    text-align:center; font-size:clamp(1.05rem,2.6vw,1.4rem); color:var(--gold-lt);
    font-style:italic; margin:1.6em auto 0; max-width:26em; line-height:1.6;
  }
  .split{
    text-align:center; font-size:clamp(1.3rem,5vw,2rem); margin:.2em 0 .1em; letter-spacing:.02em;
  }
  .split .a{color:var(--gryff-1)} .split .b{color:#57a86f} .split .dash{color:var(--gold); margin:0 .4em}
  /* ---- countdown ---- */
  .timer{
    display:block; width:max-content; margin:0 auto 1.1em; text-align:center;
    font-variant:small-caps; letter-spacing:.18em; color:var(--gold-lt);
    border:1px solid var(--line); border-radius:999px; padding:.3em 1.1em;
    background:rgba(0,0,0,.25); font-size:clamp(.9rem,2.2vw,1.15rem);
  }
  .timer.urgent{color:#ff8f8f; border-color:rgba(184,56,59,.7);
    background:rgba(138,18,21,.25); animation:tick 1s steps(2,end) infinite}
  .timer.done{color:rgba(241,230,200,.55); border-color:rgba(241,230,200,.18);
    background:transparent; animation:none}
  @keyframes tick{0%,100%{opacity:1}50%{opacity:.55}}
  .timerbar{
    width:min(560px,90%); height:4px; margin:0 auto 1.6em; border-radius:999px;
    background:rgba(241,230,200,.12); overflow:hidden;
  }
  .timerbar span{
    display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--gold), var(--gold-lt));
    transition:width 1s linear;
  }
  .timerbar span.urgent{background:linear-gradient(90deg, var(--gryff-0), var(--gryff-1))}
  /* ---- QR card (host only, top-left) ---- */
  .qrcard{
    position:fixed; top:clamp(12px,2vw,22px); left:clamp(12px,2vw,22px); z-index:5;
    width:clamp(132px,13vw,182px); padding:.7em .7em .55em; text-align:center;
    border-radius:14px; border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(241,230,200,.10), rgba(0,0,0,.35));
    box-shadow:0 10px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(241,230,200,.14);
    backdrop-filter:blur(3px);
  }
  .qrcard .qrframe{
    background:var(--cream); border-radius:8px; padding:6px;
    box-shadow:0 0 22px rgba(232,198,90,.22);
  }
  .qrcard svg{display:block; width:100%; height:auto}
  .qrcard .cap{
    display:block; margin-top:.5em; font-variant:small-caps; letter-spacing:.14em;
    color:var(--gold-lt); font-size:clamp(.6rem,1vw,.75rem); line-height:1.4;
  }
  /* ---- music toggle (host only, top-right) ---- */
  .musicbtn{
    position:fixed; top:clamp(12px,2vw,22px); right:clamp(12px,2vw,22px); z-index:5;
    display:inline-flex; align-items:center; gap:.5em;
    border-radius:999px; border:1px solid var(--line); padding:.55em 1.1em;
    background:linear-gradient(180deg, rgba(201,162,39,.18), rgba(0,0,0,.35));
    color:var(--gold-lt); font-variant:small-caps; letter-spacing:.14em;
    font-size:clamp(.72rem,1.2vw,.9rem); backdrop-filter:blur(3px);
    transition:box-shadow .2s ease, background .2s ease;
  }
  .musicbtn:hover{background:linear-gradient(180deg, rgba(201,162,39,.3), rgba(0,0,0,.3));
    box-shadow:0 0 26px rgba(201,162,39,.25)}
  .musicbtn.playing{color:var(--cream); border-color:rgba(232,198,90,.7);
    box-shadow:0 0 26px rgba(201,162,39,.3)}
  .musicbtn .note{font-size:1.05em; line-height:1}
  .musicbtn.playing .note{animation:sway 2.4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-2px) rotate(6deg)}}
  .musicbtn.missing{color:rgba(241,230,200,.5); border-color:rgba(241,230,200,.18)}

  .linkbox{
    margin:1.6em auto 0; max-width:34em; text-align:center;
    border:1px solid var(--line); border-radius:14px; padding:1em 1.2em;
    background:rgba(0,0,0,.22);
  }
  .linkbox .cap{font-variant:small-caps; letter-spacing:.18em; color:var(--gold); font-size:.8rem}
  .linkbox code{
    display:block; margin:.5em 0 .1em; color:var(--cream); word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92rem;
  }
  /* ---- lobby QR: big, centred, scannable from across the room ---- */
  .qrbig{
    margin:.4em auto 1.6em; text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }
  .qrbig .qrframe{
    background:var(--cream); border-radius:16px; padding:clamp(10px,1.4vw,18px);
    border:1px solid var(--line);
    box-shadow:0 0 60px rgba(232,198,90,.28), 0 18px 50px rgba(0,0,0,.5);
    width:clamp(190px,34vh,320px);
  }
  .qrbig svg{display:block; width:100%; height:auto}
  .qrbig-cap{
    margin:.85em 0 0; font-variant:small-caps; letter-spacing:.2em;
    color:var(--gold-lt); font-size:clamp(.85rem,1.8vw,1.15rem);
  }

  /* ---- language toggle (guest) ---- */
  .langrow{display:flex; justify-content:flex-end; margin:0 0 .6em}
  .langbtn{
    display:inline-flex; align-items:center; gap:.45em;
    border-radius:999px; border:1px solid var(--line); padding:.45em 1em;
    background:linear-gradient(180deg, rgba(201,162,39,.16), rgba(0,0,0,.3));
    color:var(--gold-lt); letter-spacing:.06em; font-size:.85rem;
  }
  .langbtn .globe{opacity:.8}
  .langbtn:active{background:rgba(201,162,39,.3)}

  /* ---- parent portraits on the closing screen ---- */
  .faceoff{
    display:flex; align-items:center; justify-content:center;
    gap:clamp(12px,3vw,38px); margin:.2em auto 1em; flex-wrap:nowrap;
  }
  .por{margin:0; text-align:center; flex:0 0 auto}
  .por img{
    display:block; width:clamp(92px,15vw,168px); height:clamp(92px,15vw,168px);
    object-fit:cover; border-radius:50%; border:3px solid var(--line);
    box-shadow:0 10px 34px rgba(0,0,0,.5);
  }
  .por.a img{border-color:rgba(184,56,59,.85); box-shadow:0 0 34px rgba(184,56,59,.35)}
  .por.b img{border-color:rgba(47,107,69,.9);  box-shadow:0 0 34px rgba(47,107,69,.35)}
  .por.winner img{border-color:var(--gold-lt); box-shadow:0 0 44px rgba(232,198,90,.5)}
  .por figcaption{
    margin-top:.5em; font-variant:small-caps; letter-spacing:.12em;
    color:var(--gold-lt); font-size:clamp(.78rem,1.6vw,1rem);
  }
  .por.nopic{display:none}      /* no photo yet — the split still reads fine alone */
  .vs{flex:0 1 auto; min-width:0}
  .vsnames{
    text-align:center; margin:.1em 0 0; font-variant:small-caps; letter-spacing:.14em;
    font-size:clamp(.8rem,1.8vw,1.05rem);
  }
  .vsnames .a{color:var(--gryff-1)} .vsnames .b{color:#57a86f}

  /* ---- final scoreboard ---- */
  .endwrap{padding-bottom:2em}
  .bigsplit{
    text-align:center; margin:.1em 0 0; line-height:1.25; white-space:nowrap;
    font-size:clamp(1.6rem,5.5vw,3.2rem);
  }
  .bigsplit .a{color:var(--gryff-1)} .bigsplit .b{color:#57a86f}
  .bigsplit .dash{color:var(--gold); margin:0 .35em}
  .verdict{
    text-align:center; color:var(--cream); font-style:italic; margin:0 auto 1.4em;
    max-width:34em; font-size:clamp(1rem,2.3vw,1.3rem); line-height:1.6;
  }
  .verdict strong{color:var(--gold-lt); font-style:normal}
  .scoreboard{
    display:flex; gap:clamp(10px,2.4vw,26px); justify-content:center; flex-wrap:wrap;
    margin:0 auto 1.4em;
  }
  .sc{
    border:1px solid var(--line); border-radius:14px; padding:.7em 1.1em; min-width:8.5em;
    background:linear-gradient(180deg, rgba(241,230,200,.07), rgba(0,0,0,.25)); text-align:center;
  }
  .sc .n{display:block; font-size:clamp(1.5rem,3.6vw,2.3rem); color:var(--gold-lt); line-height:1.1}
  .sc .l{display:block; font-variant:small-caps; letter-spacing:.12em;
    color:rgba(241,230,200,.65); font-size:.76rem; margin-top:.25em}
  .sc.a{border-color:rgba(184,56,59,.55)} .sc.a .n{color:#e88b8d}
  .sc.b{border-color:rgba(47,107,69,.6)}  .sc.b .n{color:#7fc094}
  .footnote{
    text-align:center; color:rgba(241,230,200,.6); font-size:.9rem;
    max-width:44em; margin:0 auto 1.8em; line-height:1.7;
  }
  .footnote em{color:var(--cream); font-style:italic}
  .breakdown{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));
    gap:.45em clamp(18px,3vw,40px); max-width:1000px; width:100%; margin:0 auto;
  }
  .brow{
    display:grid; grid-template-columns:1.5em minmax(0,1fr) 5.5em 3.4em;
    gap:.7em; align-items:center; font-size:.86rem;
  }
  .brow .num{color:var(--gold); font-size:.72rem; text-align:right}
  .brow .btxt{color:rgba(241,230,200,.8); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bbar{display:flex; height:9px; border-radius:999px; overflow:hidden;
    background:rgba(241,230,200,.10); box-shadow:inset 0 0 0 1px rgba(241,230,200,.08)}
  .bbar i{display:block; height:100%}
  .bbar .ba{background:linear-gradient(90deg, var(--gryff-0), var(--gryff-1))}
  .bbar .bb{background:linear-gradient(90deg, var(--slyth-1), var(--slyth-0))}
  .brow .bnum{color:rgba(241,230,200,.7); font-size:.78rem; text-align:right; letter-spacing:.04em}
  .brow .bnum.quiet{color:rgba(241,230,200,.35)}
  .tagline.closing{margin-top:1.8em}

  /* Devanagari has no small-caps and reads badly with wide tracking, so the
     gold label styling relaxes when the page is in Hindi. */
  :root[lang="hi"] .eyebrow,
  :root[lang="hi"] .qmeta,
  :root[lang="hi"] .timer,
  :root[lang="hi"] .opt .letter,
  :root[lang="hi"] .vial-label .letter,
  :root[lang="hi"] .sc .l,
  :root[lang="hi"] .vsnames,
  :root[lang="hi"] .por figcaption,
  :root[lang="hi"] .linkbox .cap{letter-spacing:.02em; font-variant:normal}
  :root[lang="hi"] .question{line-height:1.4}
  :root[lang="hi"] .opt .letter{font-size:clamp(.95rem,2.2vw,1.25rem)}

  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); margin:2em 0}
  .footer-note{text-align:center; color:rgba(241,230,200,.45); font-size:.8rem; margin-top:2.4em}
  .hidden{display:none !important}

  /* On the big screen the two cards sit side by side, so they want to be wide
     and short — a phone gets the tall portrait crop instead. */
  @media (min-width:781px){
    .optframe{max-height:34vh}
    /* The QR sits top-left and the music button top-right, so the question
       above the cards needs a lane of its own between them. */
    :root[data-role="host"] .qmeta,
    :root[data-role="host"] .question{padding-inline:clamp(150px,17vw,240px)}
  }
  /* One column below the two-column threshold. auto-fit alone can leave a
     second column hanging off-screen on a phone, so pin it explicitly. */
  @media (max-width:780px){
    .faceoff{gap:10px}
    .breakdown{grid-template-columns:1fr}
    .brow{grid-template-columns:1.4em minmax(0,1fr) 4.5em 3.2em; font-size:.82rem}
    .scoreboard{gap:8px}
    .sc{min-width:7em; padding:.6em .8em}
  }
  /* the QR card is for the big screen; a phone doesn't need to scan itself */
  @media (max-width:720px){
    .qrcard{display:none}
    .musicbtn{position:static; margin:1.2em auto 0; display:inline-flex}
  }
  @media (max-width:560px){
    .options{grid-template-columns:1fr}
    .vials{gap:18px}
  }
  @media (prefers-reduced-motion:reduce){
    .fill{transition:none}
    .timerbar span{transition:none}
    .timer.urgent{animation:none}
    .musicbtn.playing .note{animation:none}
    .live-note .pulse{animation:none; opacity:1}
    .btn,.opt{transition:none}
  }
</style>
</head>

<script type="module">
/* ============================================================================
   THE SORTING VOTE — live A/B voting for a magical first birthday
   Single file. No build step. Host it anywhere static (GitHub Pages).
   ========================================================================= */

/* ----------------------------------------------------------------------------
   1) PERSONALISE ME — questions & copy. Edit freely; app logic never changes.
   -------------------------------------------------------------------------- */
const BABY_NAME = "Baby";           // swap in the actual name; used in copy below

/* The two sides. Option A is always PARENT_A's prediction, option B always
   PARENT_B's — that holds for every question, and the closing scoreboard
   tallies the room across all of them. Swap the names (both scripts) and the
   whole app, scoreboard included, follows. */
const PARENT_A = "Anchit",  PARENT_A_HI = "अंचित";
const PARENT_B = "Gunjan",  PARENT_B_HI = "गुंजन";

/* Portraits shown on the closing screen. Drop the two files in and they
   appear; if either is missing the scoreboard simply renders without it. */
const PARENT_A_PIC  = "img/anchit.jpg";        // round, closing scoreboard
const PARENT_B_PIC  = "img/gunjan.jpg";
const PARENT_A_CARD = "img/anchit-card.jpg";   // tall, the tappable option
const PARENT_B_CARD = "img/gunjan-card.jpg";

/* Every question is a "who?" — the two photographs are the answer, so the
   option cards carry no text at all. Each entry needs the question in both
   languages; the options are always the two parents. Add or remove entries
   freely, the counter and scoreboard follow the array. */
const A = { en: PARENT_A, hi: PARENT_A_HI };
const B = { en: PARENT_B, hi: PARENT_B_HI };

const QUESTIONS = [
  { q:{en:"Who is more likely to spoil the baby?",
       hi:"बेबी को सबसे ज़्यादा कौन बिगाड़ेगा?"}, a:A, b:B },

  { q:{en:"Who will say “No” more often?",
       hi:"“ना” ज़्यादा कौन कहेगा?"}, a:A, b:B },

  { q:{en:"Who wakes up first when the baby cries?",
       hi:"बेबी के रोते ही पहले कौन उठेगा?"}, a:A, b:B },

  { q:{en:"Who takes more photos and videos of the baby?",
       hi:"बेबी की फ़ोटो और वीडियो ज़्यादा कौन खींचेगा?"}, a:A, b:B },

  { q:{en:"Who is more likely to buy something the baby doesn't need? 😂",
       hi:"बेबी के लिए बेमतलब की चीज़ें कौन ख़रीद लाएगा? 😂"}, a:A, b:B },

  { q:{en:"Who can calm the baby faster?",
       hi:"बेबी को जल्दी कौन चुप करा लेगा?"}, a:A, b:B },

  { q:{en:"Who knows exactly what the baby wants, just by looking at him?",
       hi:"बेबी को देखते ही कौन समझ जाएगा कि उसे क्या चाहिए?"}, a:A, b:B },

  { q:{en:"Who gives in first when the baby throws a tantrum?",
       hi:"बेबी के ज़िद करने पर पहले कौन पिघल जाएगा?"}, a:A, b:B },

  { q:{en:"Who will be more protective?",
       hi:"ज़्यादा प्रोटेक्टिव कौन होगा?"}, a:A, b:B },

  { q:{en:"Who will be the stricter parent?",
       hi:"सख़्त पैरेंट कौन बनेगा?"}, a:A, b:B },

  { q:{en:"Who will be more nervous when he starts dating?",
       hi:"जब वो डेटिंग शुरू करेगा, ज़्यादा घबराएगा कौन?"}, a:A, b:B },

  { q:{en:"Who will help him with his homework?",
       hi:"होमवर्क में उसकी मदद कौन करेगा?"}, a:A, b:B },

  { q:{en:"Who will slip him extra pocket money?",
       hi:"चुपके से ज़्यादा पॉकेट मनी कौन देगा?"}, a:A, b:B },

    const qr = qrcode(0, "M");            // 0 = pick the smallest version that fits

    const n = qr.getModuleCount(), quiet = 2, size = n + quiet * 2;
    let d = "";

        if (qr.isDark(r, c)) d += `M${c + quiet} ${r + quiet}h1v1h-1z`;

  } catch (err) {
    qrSvgCache = "";                      // never let a QR failure blank the screen

}

/* ----------------------------------------------------------------------------
   4) Sync layer — Firebase Realtime Database (push-based listeners).
      Falls back to an in-memory demo store when the config is still a placeholder.
   -------------------------------------------------------------------------- */
const CONFIGURED = !JSON.stringify(firebaseConfig).includes("PASTE_");

// Assigned by initSync(), which is called at the very bottom of this script —
// after the view functions exist. Firebase fires its listeners (and therefore
// render()) the instant they're attached, so wiring sync up any earlier would
// call render() before the views are initialised.
let setState = () => {}, castVote = () => {}, resetAll = () => {};

/* ----------------------------------------------------------------------------
   Two sync paths, because Firebase's free tier caps *live* connections at 100:

   HOST   — one device, one live socket. Sees votes arrive in real time and is
            the only writer of the published tallies.
   GUESTS — no socket at all. They poll one tiny endpoint over plain HTTPS, so
            they don't consume a connection and the guest count is unlimited.
            They also skip downloading the Firebase SDK, so their page loads
            faster than it did on the live path.

   Raw votes are APPENDED (one child per vote, unique key) rather than
   incremented, because REST has no transactions and two simultaneous voters
   would otherwise overwrite each other. The host counts them and republishes
   compact tallies at reveal — a single writer, so no contention.

     <root>/pub/state          { qIndex, phase, startsAt }   ← guests poll this
     <root>/pub/tallies/<q>    { a, b }                      ← published at reveal
     <root>/votes/<q>/<pushId> "a" | "b"                     ← raw, host reads
   -------------------------------------------------------------------------- */
const REST = firebaseConfig.databaseURL ? firebaseConfig.databaseURL.replace(/\/$/, "") : "";
const POLL_MS = 700;               // guest refresh; well under human reaction time
let lastPollOk = 0;

// Turn the raw append-only votes into { [q]: {a,b} }.
function countRaw(raw) {
  const out = {};
  for (const q in raw || {}) {
    let a = 0, b = 0;
    for (const id in raw[q]) raw[q][id] === "a" ? a++ : b++;
    out[q] = { a, b };
  }
  return out;
}

async function initSync() {
  if (!CONFIGURED) {
    // DEMO MODE: single device only. Lets you rehearse before Firebase is wired up.
    connected = false;
    setState  = (next) => { state = next; render(); };
    castVote  = (qIndex, choice) => {
      const t = { ...tally(qIndex) }; t[choice] = (t[choice] || 0) + 1;
      votes = { ...votes, [qIndex]: t }; render();
    };
    resetAll  = () => { votes = {}; state = { qIndex: 0, phase: "lobby", startsAt: 0 }; render(); };
    return render();
  }

  if (role === "host") {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getDatabase, ref, onValue, set, remove } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");

    const db = getDatabase(initializeApp(firebaseConfig));
    const stateRef   = ref(db, ROOT + "/pub/state");
    const talliesRef = ref(db, ROOT + "/pub/tallies");
    const votesRef   = ref(db, ROOT + "/votes");

    onValue(ref(db, ".info/connected"), (snap) => { connected = snap.val() === true; render(); });
    // Everyone counts down against Firebase's clock, not their own.
    onValue(ref(db, ".info/serverTimeOffset"), (snap) => { clockSkew = snap.val() || 0; render(); });
    onValue(stateRef, (snap) => {
      const v = snap.val();
      state = v && typeof v.qIndex === "number"
        ? { qIndex: v.qIndex, phase: v.phase || "lobby", startsAt: v.startsAt || 0 }
        : { qIndex: 0, phase: "lobby", startsAt: 0 };
      render();
    });
    onValue(votesRef, (snap) => { votes = countRaw(snap.val()); render(); });

    // Publishing the tallies for a question is what lets guests see results
    // without ever reading the raw votes, so their poll stays tiny.
    const publish = (q) => set(ref(db, `${ROOT}/pub/tallies/${q}`), tally(q));

    setState = async (next) => {
      if (next.phase === "revealed") await publish(next.qIndex);
      return set(stateRef, next);
    };
    castVote = (qIndex, choice) => restVote(qIndex, choice);   // the host rarely votes
    resetAll = async () => {
      await Promise.all([remove(votesRef), remove(talliesRef)]);
      votes = {};
      return set(stateRef, { qIndex: 0, phase: "lobby", startsAt: 0 });
    };

  } else {
    // ---- GUEST: polling, no live connection, no SDK ----
    setState = () => {};                       // guests never drive the game
    castVote = (qIndex, choice) => restVote(qIndex, choice);
    resetAll = () => {};

    const poll = async () => {
      try {
        const r = await fetch(`${REST}/${ROOT}/pub.json`, { cache: "no-store" });
        if (!r.ok) throw new Error(r.status);
        const pub = await r.json() || {};
        const v = pub.state;
        const next = v && typeof v.qIndex === "number"
          ? { qIndex: v.qIndex, phase: v.phase || "lobby", startsAt: v.startsAt || 0 }
          : { qIndex: 0, phase: "lobby", startsAt: 0 };
        const changed = next.qIndex !== state.qIndex || next.phase !== state.phase ||
                        next.startsAt !== state.startsAt ||
                        JSON.stringify(pub.tallies || {}) !== JSON.stringify(votes);
        state = next;
        votes = pub.tallies || {};
        // Trust the Date header for the shared clock — same trick as
        // serverTimeOffset, without needing a socket.
        const served = Date.parse(r.headers.get("date") || "");
        if (!Number.isNaN(served)) clockSkew = served - Date.now();
        lastPollOk = Date.now();
        const wasConnected = connected;
        connected = true;
        if (changed || !wasConnected) render();   // also repaint the "● live" pill
      } catch (err) {
        connected = Date.now() - lastPollOk < 4000;   // brief blips shouldn't flicker
        render();
      }
    };
    poll();
    setInterval(poll, POLL_MS);
  }
  render();
}

// One vote = one new child with a unique key, so simultaneous voters can never
// overwrite each other even without a transaction.
async function restVote(qIndex, choice) {
  try {
    await fetch(`${REST}/${ROOT}/votes/${qIndex}.json`,
                { method: "POST", body: JSON.stringify(choice) });
  } catch (err) {
    console.warn("vote failed to send:", err);
  }
}

  musicEl.innerHTML = `<span class="note">${musicPlaying ? "♫" : "♪"}</span>
    ${musicMissing ? "no music file" : musicPlaying ? "pause the music" : "play the music"}`;
}

// The QR is for people who still need to join; retire it on the closing screen.
function paintHostChrome() {
  // In the lobby the QR is big and centred, and on the closing screen it's
  // done its job — the corner card belongs to the questions in between.
  if (qrEl) qrEl.style.display = (state.phase === "lobby" || state.phase === "end") ? "none" : "";
  paintMusicButton();
}

// Wipes every vote and returns to the lobby. Needs two clicks — the second
// one confirms, and it disarms itself after four seconds.
const restartBtn = () => `
  <button class="btn ghost ${restartArmed ? "arm" : ""}" data-act="restart">
    ${restartArmed ? "↺ Tap again to wipe all votes" : "↺ Restart"}
  </button>`;

// Guest-only. One tap swaps every string on this phone; nobody else's screen
// changes, and nothing is stored.
const langToggle = () => role === "host" ? "" : `
  <div class="langrow">
    <button class="langbtn" data-act="lang">
      <span class="globe">⌘</span>${T().langName}
    </button>
  </div>`;

// The lobby's big centred QR — everyone in the room scans this before the
// first question. Once voting starts it gives way to the corner card.
const qrBig = () => {
  const svg = guestQrSvg();
  return svg ? `<div class="qrbig">
      <div class="qrframe">${svg}</div>
      <p class="qrbig-cap">Scan to join the sorting</p>
    </div>` : "";
};

// Closing-screen portrait. Skips itself cleanly if the image file isn't there.
const portrait = (k, winner) => `
  <figure class="por ${k}${winner ? " winner" : ""}">
    <img src="${k === "a" ? PARENT_A_PIC : PARENT_B_PIC}" alt="${esc(NAME(k))}"
         onerror="this.closest('.por').classList.add('nopic')">
    <figcaption>${esc(NAME(k))}${winner ? ` <span class="crown">👑</span>` : ""}</figcaption>
  </figure>`;

const countdown = () => {
  const left = secsLeft();
  if (left === null) return "";
  const cls = left === 0 ? "done" : left <= 6 ? "urgent" : "";
  const pctLeft = (left / QUESTION_SECONDS) * 100;
  return `<div class="timer ${cls}">${left === 0 ? T().timesUp : T().secsLeft(left)}</div>
    <div class="timerbar"><span class="${left <= 6 ? "urgent" : ""}" style="width:${pctLeft}%"></span></div>`;
};

/* ---- final scoreboard --------------------------------------------------- */
// Everything the closing screen needs, computed from the vote tallies.
function overall() {
  let a = 0, b = 0, wonA = 0, wonB = 0, tied = 0, answered = 0;
  const rows = QUESTIONS.map((_, i) => {
    const t = tally(i), tot = t.a + t.b;
    a += t.a; b += t.b;
    if (tot) {
      answered++;
      if (t.a > t.b) wonA++; else if (t.b > t.a) wonB++; else tied++;
    }
    return { i, q: qt(i), t, tot, lead: tot ? Math.abs(pct(t.a, tot) - pct(t.b, tot)) : null };
  });
  const scored = rows.filter(r => r.tot);
  const byLead = [...scored].sort((x, y) => x.lead - y.lead);
  return { a, b, total: a + b, wonA, wonB, tied, answered, rows,
           closest: byLead[0] || null, widest: byLead[byLead.length - 1] || null };
}

// How this particular guest voted across the night.
function myTake() {
  let a = 0, b = 0;
  for (const v of myVotes.values()) v === "a" ? a++ : b++;
  return { a, b, total: a + b };
}

function scoreboard() {
  const o = overall();
  if (!o.total) return `<p class="tagline">${T().nothing}</p>`;

  const pa = pct(o.a, o.total), pb = pct(o.b, o.total);
  const verdict = o.wonA === o.wonB
    ? T().deadHeat(esc(NAME("a")), esc(NAME("b")))
    : T().verdict(esc(NAME(o.wonA > o.wonB ? "a" : "b")), Math.max(o.wonA, o.wonB), o.answered);
  const won = o.wonA === o.wonB ? null : (o.wonA > o.wonB ? "a" : "b");

  const rows = o.rows.map(r => `
    <div class="brow">
      <span class="num">${r.i + 1}</span>
      <span class="btxt">${esc(r.q)}</span>
      ${r.tot ? `
        <span class="bbar"><i class="ba" style="width:${pct(r.t.a, r.tot)}%"></i><i class="bb" style="width:${pct(r.t.b, r.tot)}%"></i></span>
        <span class="bnum">${pct(r.t.a, r.tot)}–${pct(r.t.b, r.tot)}</span>`
      : `<span class="bbar empty"></span><span class="bnum quiet">${T().noVotes}</span>`}
    </div>`).join("");

  return `
    <p class="eyebrow">${T().finalTally}</p>
    <div class="faceoff">
      ${portrait("a", won === "a")}
      <div class="vs">
        <p class="bigsplit">
          <span class="a">${pa}%</span><span class="dash">—</span><span class="b">${pb}%</span>
        </p>
        <p class="vsnames"><span class="a">${esc(NAME("a"))}</span> · <span class="b">${esc(NAME("b"))}</span></p>
      </div>
      ${portrait("b", won === "b")}
    </div>
    <p class="verdict">${verdict}</p>

    <div class="scoreboard">
      <div class="sc a"><span class="n">${o.wonA}</span><span class="l">${T().questionsTo(esc(NAME("a")))}</span></div>
      ${o.tied ? `<div class="sc t"><span class="n">${o.tied}</span><span class="l">${T().tied}</span></div>` : ""}
      <div class="sc b"><span class="n">${o.wonB}</span><span class="l">${T().questionsTo(esc(NAME("b")))}</span></div>
      <div class="sc"><span class="n">${o.total}</span><span class="l">${T().votesAll}</span></div>
    </div>

    ${o.widest && o.widest.lead > 0 ? `<p class="footnote">
      ${T().widest(esc(o.widest.q), o.widest.lead)}
      ${o.closest && o.closest !== o.widest ? T().closest(esc(o.closest.q), o.closest.lead) : ""}
    </p>` : ""}

    <div class="breakdown">${rows}</div>`;
}

const questionBlock = () => `
  <p class="qmeta">${T().qOf(state.qIndex + 1, TOTAL)}</p>
  <h2 class="question">${esc(qt(state.qIndex))}</h2>`;

function viewHost() {
  if (state.phase === "lobby") {
    return `${header(`${TOTAL} questions, and every one of them is the same: ${PARENT_A} or ${PARENT_B}? Scan in, then begin when everyone's settled.`)}
      <div class="center">
        ${qrBig()}
        <div class="controls"><button class="btn primary big" data-act="begin">Begin Voting</button></div>
        ${statusPill()}
        <div class="linkbox">
          <span class="cap">or open this link</span>
          <code>${esc(GUEST_LINK)}</code>
        </div>
        <p class="footer-note">${TOTAL} questions · ${QUESTION_SECONDS} seconds each · guests vote from their own phones</p>
      </div>`;
  }
  if (state.phase === "end") {
    return `<div class="center endwrap">
        <h2 class="question">The votes are in.</h2>
        ${scoreboard()}
        <p class="tagline closing">However ${esc(BABY_NAME)} turns out, this lot will be cheering ✨</p>
        <div class="controls">
          <button class="btn" data-act="reset">Run again from the start</button>
          ${restartBtn()}
        </div>
      </div>`;
  }
  const revealed = state.phase === "revealed";
  const last = state.qIndex === TOTAL - 1;
  const t = tally(state.qIndex), total = t.a + t.b;
  return `<div class="center">
    ${questionBlock()}
    ${revealed ? vials() : `
      ${countdown()}
      <p class="live-note"><span class="pulse">${timeUp() ? "✦ Voting closed — revealing…" : "✦ Votes are arriving…"}</span></p>
      ${optionCards({ asButtons: false })}
      <p class="live-note" style="margin-top:1.4em">Results sealed until the reveal.</p>`}
    <div class="controls">
      ${revealed
        ? `<button class="btn primary" data-act="next">${last ? "Finish →" : "Next Question →"}</button>`
        : `<button class="btn primary" data-act="reveal">Reveal Results</button>`}
      ${restartBtn()}
    </div>
    ${revealed ? "" : `<p class="footer-note">${total} vote${total === 1 ? "" : "s"} in so far (hidden from the room)</p>`}
  </div>`;
}

function viewGuest() {
  if (state.phase === "lobby") {
    return `${langToggle()}
      ${header(T().tagline(TOTAL))}
      <div class="center">
        <h2 class="question">${T().waitTitle}</h2>
        <p class="tagline">${T().waitBody(QUESTION_SECONDS)}</p>
        ${statusPill()}
      </div>`;
  }
  if (state.phase === "end") {
    const m = myTake();
    const yours = m.total
      ? (m.a === m.b ? T().yoursSplit(m.total)
                     : T().yoursSide(esc(NAME(m.a > m.b ? "a" : "b")), Math.max(m.a, m.b), m.total))
      : T().yoursNone;
    return `${langToggle()}<div class="center endwrap">
        <h2 class="question">${T().thanks}</h2>
        <p class="verdict">${yours}</p>
        ${scoreboard()}
        <p class="tagline closing">${T().cake(esc(BABY_NAME))}</p>
      </div>`;
  }
  const mine = myVotes.get(voteKey());
  if (state.phase === "revealed") {
    const t = tally(state.qIndex), total = t.a + t.b;
    return `${langToggle()}<div class="center">
      ${questionBlock()}
      <p class="split">
        <span class="a">${esc(NAME("a"))} ${pct(t.a, total)}%</span><span class="dash">—</span><span class="b">${pct(t.b, total)}% ${esc(NAME("b"))}</span>
      </p>
      <p class="total">${T().votesCast(total)}</p>
      ${optionCards({ asButtons: false, chosen: mine })}
      <p class="guest-msg">${mine ? T().youPicked(mine.toUpperCase(), esc(ot(state.qIndex, mine))) : T().satOut}</p>
    </div>`;
  }
  const closed = timeUp();
  return `${langToggle()}<div class="center">
    ${questionBlock()}
    ${countdown()}
    ${optionCards({ asButtons: true, disabled: !!mine || closed, chosen: mine })}
    <p class="guest-msg">${mine ? T().voteIn : closed ? T().tooLate : T().tapFast}</p>
  </div>`;
}

function render() {
  document.documentElement.lang = role === "host" ? "en" : lang;
  document.documentElement.dataset.role = role;
  app.innerHTML = role === "host" ? viewHost() : viewGuest();
  paintHostChrome();
}

/* ----------------------------------------------------------------------------
   6) Events (delegated, so re-rendering never loses handlers)
   -------------------------------------------------------------------------- */
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act],[data-vote]");
  if (!el) return;

  if (el.dataset.act === "lang")   { lang = lang === "en" ? "hi" : "en"; return render(); }
  if (el.dataset.act === "restart") {
    if (!restartArmed) {                    // one stray click shouldn't wipe the party
      restartArmed = true; render();
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => { restartArmed = false; render(); }, 4000);
      return;
    }
    clearTimeout(restartTimer);
    restartArmed = false; autoRevealed = null; myVotes.clear();
    return resetAll();
  }
  if (el.dataset.act === "begin")  return setState({ qIndex: 0, phase: "voting", startsAt: now() });
  if (el.dataset.act === "reveal") return setState({ qIndex: state.qIndex, phase: "revealed", startsAt: state.startsAt });
  if (el.dataset.act === "next")   return setState(
      state.qIndex >= TOTAL - 1 ? { qIndex: state.qIndex, phase: "end", startsAt: 0 }
                                : { qIndex: state.qIndex + 1, phase: "voting", startsAt: now() });
  if (el.dataset.act === "reset")  { autoRevealed = null; myVotes.clear(); return resetAll(); }

  if (el.dataset.vote) {
    const choice = el.dataset.vote, i = state.qIndex, key = voteKey();
    if (state.phase !== "voting" || myVotes.has(key) || timeUp()) return;  // once, and only in time
    myVotes.set(key, choice);
    render();                                                 // instant local feedback
    castVote(i, choice);
  }
});

/* ----------------------------------------------------------------------------
   7) The clock. Re-renders only when the displayed second changes, and lets the
      host's screen (one writer, so no double-write) close voting at zero.
   -------------------------------------------------------------------------- */
// Repaint just the countdown, in place. Returns false if the nodes aren't there.
function paintTimer(left) {
  const t = document.querySelector(".timer"), bar = document.querySelector(".timerbar span");
  if (!t || !bar) return false;
  t.textContent = left === 0 ? T().timesUp : T().secsLeft(left);
  t.className = "timer " + (left === 0 ? "done" : left <= 6 ? "urgent" : "");
  bar.style.width = (left / QUESTION_SECONDS) * 100 + "%";
  bar.className = left <= 6 ? "urgent" : "";
  return true;
}

let shownSec = null, autoRevealed = null;
setInterval(() => {
  const left = secsLeft();
  if (left === null) { shownSec = null; return; }
  if (left !== shownSec) {
    shownSec = left;
    // A full render only at zero (it has to disable the vote buttons); every
    // other second just repaints the two countdown nodes.
    if (left === 0 || !paintTimer(left)) render();
  }
  if (left === 0 && role === "host" && autoRevealed !== state.qIndex) {
    autoRevealed = state.qIndex;      // the round-trip takes a moment; only write once
    setState({ qIndex: state.qIndex, phase: "revealed", startsAt: state.startsAt });
  }
}, 200);

buildHostChrome();
render();
initSync();
</script>
</body>
</html>
